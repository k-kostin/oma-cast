name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # WarpBuild's 2-vCPU Ubuntu runner.
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Glob, not a directory: Node 24 doesn't expand `node --test tests/`.
      # The live Omarchy menu test skips itself when Omarchy isn't installed.
      - name: Unit tests
        run: node --test tests/*.test.js

      - name: Shell syntax
        run: bash -n bin/oma-cast tests/smoke.sh

      - name: Plugin manifest is valid JSON
        run: node -e 'JSON.parse(require("fs").readFileSync("plugin/manifest.json", "utf8"))'

  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path helper/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path helper/Cargo.toml
      - run: cargo clippy --locked --manifest-path helper/Cargo.toml --all-targets -- -D warnings
